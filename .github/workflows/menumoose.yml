name: MenuMoose

on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday UTC 4:00 = Helsinki 7:00
  workflow_dispatch:

jobs:
  menumoose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run menumoose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python menumoose.py

      - name: Notify failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python << 'PYEOF'
          import resend, os
          resend.api_key = os.environ['RESEND_API_KEY']
          resend.Emails.send({
              'from': 'MenuMoose <noreply@panda-tech.top>',
              'to': 'qiang.1.huang@nokia.com',
              'subject': '[MenuMoose] Weekly menu pipeline FAILED',
              'html': '<p>MenuMoose weekly menu pipeline failed. Check <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">GitHub Actions run</a> for details.</p>',
          })
          print('Failure notification sent.')
          PYEOF
